name: Submit a tool
description: Suggest an AI tool for ToolDrop
title: "[Tool] "
labels: ["submission"]
body:
  - type: input
    id: tool-name
    attributes: {label: Tool name}
    validations: {required: true}
  - type: input
    id: tool-url
    attributes: {label: Official URL, placeholder: "https://"}
    validations: {required: true}
  - type: input
    id: description
    attributes: {label: One-line description}
  - type: input
    id: category
    attributes: {label: Category}
  - type: dropdown
    id: pricing
    attributes: {label: Pricing, options: [free, freemium, paid]}
